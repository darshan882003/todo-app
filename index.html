<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today - Test</title>
<style>
:root{--bg:#0e0f23;--surface:#181a38;--line:#2f3366;--text:#f2f1ff;--muted:#9a9cc8;--mint:#5eead4;--violet:#8b7cff;--r:20px}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text);padding:20px}
.view{display:none}.view.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.btn{padding:14px 22px;border-radius:14px;font-weight:700;background:var(--violet);color:#0b0c1f;border:none;cursor:pointer}
.btn:active{transform:scale(.95)}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1rem;margin-bottom:10px}
.list{list-style:none;padding:0;display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--muted);display:grid;place-items:center}
.item.done .chk{background:var(--mint);border-color:var(--mint)}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--mint)}
</style>
</head>
<body>

<!-- WELCOME -->
<section class="view on" id="welcome">
  <h1 style="font-size:2.5rem;margin-bottom:10px">Let's plan<br>your day.</h1>
  <p style="color:var(--muted);margin-bottom:20px">Add what you want to get done, tick it off.</p>
  <button class="btn" id="startBtn" style="width:100%;font-size:1.2rem;padding:18px">Start</button>
</section>

<!-- APP -->
<section class="view" id="app">
  <div class="card">
    <h2>Today</h2>
    <div class="row" style="display:flex;gap:10px;margin-bottom:16px">
      <input type="text" id="taskIn" placeholder="e.g. Drink 2 litres of water" maxlength="120">
      <button class="btn" id="addBtn">Add</button>
    </div>
  </div>
  <ul class="list" id="list"></ul>
  <p id="empty" style="text-align:center;color:var(--muted);display:none">Nothing here yet. Add a task above.</p>
</section>

<script>
const $=s=>document.querySelector(s);
function show(v){$$('.view').forEach(x=>x.classList.remove('on'));$(v).classList.add('on');}
function $$(s){return document.querySelectorAll(s);}

$('#startBtn').onclick=()=>show('#app');

function addTask(){
  const v=$('#taskIn').value.trim();
  if(!v)return;
  const li=document.createElement('li');
  li.className='item';
  li.innerHTML='<button class="chk"></button><span class="txt">'+v+'</span>';
  li.querySelector('.chk').onclick=()=>li.classList.toggle('done');
  $('#list').append(li);
  $('#taskIn').value='';
  $('#empty').style.display='none';
}
$('#addBtn').onclick=addTask;
$('#taskIn').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

console.log('TEST: Minimal app loaded');
alert('Minimal app loaded - JS works!');
</script>
</body>
</html>
